<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="card">
    <h2 class="title">Login Form</h2>

    <div class="social-btns">
      <a href="#" class="btn-facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
      <a href="#" class="btn-twitter"><i class="fab fa-twitter"></i> Twitter</a>
    </div>

    <!-- Usamos um checkbox oculto para simular o "submit tentado" -->
    <input type="checkbox" id="form-submit" hidden/>

    <div class="form-body">

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input id="email" type="email" placeholder="codinglab@.com" required/>
        <div class="tooltip"><i class="fas fa-exclamation-circle"></i> Please fill out this field.</div>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input id="password" type="password" placeholder="Password" required/>
        <div class="tooltip"><i class="fas fa-exclamation-circle"></i> Please fill out this field.</div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox"/> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <!-- Label age como botão de submit -->
      <label for="form-submit" class="btn-login">Login</label>

    </div>

    <p class="signup-text">Not a member? <a href="#">Signup now</a></p>
  </div>

</body>
</html>
